<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" role="img" aria-labelledby="title desc">
  <title id="title">Song-Lin Lv profile placeholder</title>
  <desc id="desc">A simple circular placeholder with the initials SL.</desc>
  <defs>
    <linearGradient id="bg" x1="0" x2="1" y1="0" y2="1">
      <stop offset="0%" stop-color="#0f766e"/>
      <stop offset="52%" stop-color="#2563eb"/>
      <stop offset="100%" stop-color="#7c3aed"/>
    </linearGradient>
    <radialGradient id="shine" cx="28%" cy="18%" r="80%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.38"/>
      <stop offset="55%" stop-color="#ffffff" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <rect width="512" height="512" rx="256" fill="url(#bg)"/>
  <rect width="512" height="512" rx="256" fill="url(#shine)"/>
  <circle cx="256" cy="256" r="224" fill="none" stroke="#ffffff" stroke-opacity="0.28" stroke-width="8"/>
  <text x="256" y="292" text-anchor="middle" font-family="Plus Jakarta Sans, Inter, Arial, sans-serif" font-size="154" font-weight="800" fill="#ffffff" letter-spacing="-8">SL</text>
</svg>
